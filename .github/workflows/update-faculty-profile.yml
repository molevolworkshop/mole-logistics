name: Sync Faculty Dropdown to Website

on:
  push:
    paths:
      - 'registry-data/faculty_registry.yml'

jobs:
  update-website-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout logistics repo
        uses: actions/checkout@v4

      - name: Install js-yaml locally
        run: npm install js-yaml

      - name: Update and Push to Website Repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WEBSITE_REPO_PAT }}
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            const registryFile = fs.readFileSync('registry-data/faculty_registry.yml', 'utf8');
            const registry = yaml.load(registryFile);
            const facultyNames = ["-- Not Listed / Write-in Below --", ...registry.map(p => p.name)];
            const newOptionsYaml = facultyNames.map(name => `        - "${name}"`).join('\n') + '\n';

            const owner = 'molevolworkshop';
            const repo = 'molevolworkshop.github.io';
            const path = '.github/ISSUE_TEMPLATE/faculty_profile.yml';

            let fileData;
            try {
              fileData = await github.rest.repos.getContent({ owner, repo, path });
            } catch (error) {
              console.error("Error fetching template from website repo:", error);
              process.exit(1);
            }

            const currentContent = Buffer.from(fileData.data.content, 'base64').toString('utf8');
            const sha = fileData.data.sha;

            // 3. Replace the options block using regex
            const regex = /(id: faculty_select[\s\S]*?options:\n)([\s\S]*?)(?=\n  - type:|\s*$)/;
            if (!regex.test(currentContent)) {
              console.error("Could not find faculty_select options block in the target template.");
              process.exit(1);
            }

            const updatedContent = currentContent.replace(regex, `$1${newOptionsYaml}`);

            // If nothing changed, skip committing
            if (currentContent === updatedContent) {
              console.log("Template is already up to date.");
              return;
            }

            // 4. Commit the update back to the website repo via GitHub API
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: "Auto-update faculty issue template dropdown from mole-logistics registry",
              content: Buffer.from(updatedContent).toString('base64'),
              sha: sha
            });

            console.log("Successfully updated issue template in the website repository!");